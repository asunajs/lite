# CI 只跑**不需要浏览器**的那几条：类型 + 构建 + 编译器负例 + 产物与源码同步。
#
# ⚠ 真 DOM 验收（`test:demo`）与 bench（`test:bench`）**故意不进 CI**：它们要装一份无头
# Chrome（几十 MB、还挑机器），而它们回答的问题（"这份产物在真 DOM 上对不对"）在改框架的
# 人手上跑一次更直接：
#
#   LITE_CHROME_NO_SANDBOX=1 npm run test:demo && npm run test:bench
#
# 没装浏览器的机器上这两条**会直接失败**（不印"跳过"、更不会冒充绿）⇒ 谁改谁跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typecheck → build → 编译器负例
      - run: npm run gates

      # `dist/` 入库（git 依赖要能直接用），所以**必须**钉住"产物与源码一致"。
      # 忘了 `npm run build` 就提交源码时，这一条会红在这里，而不是等到消费方那边。
      - name: dist 与源码同步
        run: |
          if ! git diff --quiet -- dist; then
            echo '✗ dist/ 与源码不一致 —— 本地跑 `npm run build` 后把 dist/ 一起提交'
            git diff --stat -- dist
            exit 1
          fi
          echo '✓ dist/ 与源码一致'
